name: release
on:
  push:
    branches:
      - production

jobs:
  release:
    runs-on: codebuild-madeiramadeira-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Release
        id: release
        uses: madeiramadeirabr/action-generate-release@1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
